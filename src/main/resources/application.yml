spring:
  application:
    name: opsvision-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opsvision}
    username: ${DB_USERNAME:opsvision}
    password: ${DB_PASSWORD:opsvision}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: opsvision-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 16
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: OpsVision AI Deployment Intelligence & Recovery backend

opsvision:
  github:
    token: ${GITHUB_API_TOKEN:}
    owner: ${GITHUB_OWNER:}
    repository: ${GITHUB_REPOSITORY:}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    connect-timeout-ms: ${GITHUB_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GITHUB_READ_TIMEOUT_MS:15000}
  scoring:
    # Factor maxima (defaults sum to 100)
    build-max: 20
    tests-max: 20
    coverage-max: 15
    static-analysis-max: 15
    security-max: 25
    workflow-max: 5
    coverage-full-threshold: 80.0
    coverage-zero-threshold: 40.0
    missing-evidence-credit: 0.0
  policy:
    # Score bands: DEPLOY >= deploy-min-score, REVIEW >= review-min-score, else BLOCK
    deploy-min-score: 80
    review-min-score: 60
    block-on-critical-finding: true
    block-on-failed-build: true
    block-on-failed-tests: true
    block-on-failed-workflow: true
    review-on-high-finding: true
  ai:
    enabled: ${OPSVISION_AI_ENABLED:false}
    # none | ollama | openai-compatible
    provider: ${OPSVISION_AI_PROVIDER:none}
    base-url: ${OPSVISION_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPSVISION_AI_API_KEY:}
    model: ${OPSVISION_AI_MODEL:gpt-4o-mini}
    connect-timeout-ms: ${OPSVISION_AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${OPSVISION_AI_READ_TIMEOUT_MS:60000}
    max-tokens: ${OPSVISION_AI_MAX_TOKENS:800}
    temperature: ${OPSVISION_AI_TEMPERATURE:0.2}
    ollama:
      base-url: ${OPSVISION_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OPSVISION_OLLAMA_MODEL:llama3.2}
  observability:
    enabled: ${OPSVISION_OBSERVABILITY_ENABLED:true}
    kubernetes:
      enabled: ${OPSVISION_K8S_ENABLED:true}
      api-base-url: ${OPSVISION_K8S_API_BASE_URL:https://kubernetes.default.svc}
      token: ${OPSVISION_K8S_TOKEN:}
      default-namespace: ${OPSVISION_K8S_NAMESPACE:default}
      default-workload: ${OPSVISION_K8S_WORKLOAD:}
      connect-timeout-ms: ${OPSVISION_K8S_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${OPSVISION_K8S_READ_TIMEOUT_MS:15000}
      insecure-skip-tls-verify: ${OPSVISION_K8S_INSECURE_SKIP_TLS:false}
    prometheus:
      enabled: ${OPSVISION_PROMETHEUS_ENABLED:true}
      base-url: ${OPSVISION_PROMETHEUS_BASE_URL:http://localhost:9090}
      connect-timeout-ms: ${OPSVISION_PROMETHEUS_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${OPSVISION_PROMETHEUS_READ_TIMEOUT_MS:15000}
      # Label matcher, e.g. job="my-app" or app="opsvision"
      service-selector: ${OPSVISION_PROMETHEUS_SERVICE_SELECTOR:}
      request-rate-query: ${OPSVISION_PROMETHEUS_REQUEST_RATE_QUERY:}
      error-rate-query: ${OPSVISION_PROMETHEUS_ERROR_RATE_QUERY:}
      error-ratio-query: ${OPSVISION_PROMETHEUS_ERROR_RATIO_QUERY:}
      latency-p50-query: ${OPSVISION_PROMETHEUS_LATENCY_P50_QUERY:}
      latency-p95-query: ${OPSVISION_PROMETHEUS_LATENCY_P95_QUERY:}
      latency-p99-query: ${OPSVISION_PROMETHEUS_LATENCY_P99_QUERY:}
      cpu-query: ${OPSVISION_PROMETHEUS_CPU_QUERY:}
      memory-query: ${OPSVISION_PROMETHEUS_MEMORY_QUERY:}
      availability-query: ${OPSVISION_PROMETHEUS_AVAILABILITY_QUERY:}
  incident:
    error-ratio-threshold: ${OPSVISION_INCIDENT_ERROR_RATIO_THRESHOLD:0.05}
    error-rate-threshold: ${OPSVISION_INCIDENT_ERROR_RATE_THRESHOLD:1.0}
    availability-min-ratio: ${OPSVISION_INCIDENT_AVAILABILITY_MIN:0.95}
    pod-restart-threshold: ${OPSVISION_INCIDENT_POD_RESTART_THRESHOLD:3}
    warning-event-threshold: ${OPSVISION_INCIDENT_WARNING_EVENT_THRESHOLD:1}
    detect-unhealthy-workload: ${OPSVISION_INCIDENT_DETECT_UNHEALTHY_WORKLOAD:true}
    require-telemetry: ${OPSVISION_INCIDENT_REQUIRE_TELEMETRY:true}

logging:
  level:
    root: INFO
    com.opsvision: INFO
    org.hibernate.SQL: WARN
    org.springframework.web.client.RestClient: WARN
