spring:
  application:
    name: opsvision-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opsvision}
    username: ${DB_USERNAME:opsvision}
    password: ${DB_PASSWORD:opsvision}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: OpsVision AI Deployment Intelligence & Recovery backend

logging:
  level:
    root: INFO
    com.opsvision: INFO
