spring:
  application:
    name: opsvision-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opsvision}
    username: ${DB_USERNAME:opsvision}
    password: ${DB_PASSWORD:opsvision}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: OpsVision AI Deployment Intelligence & Recovery backend

opsvision:
  github:
    token: ${GITHUB_API_TOKEN:}
    owner: ${GITHUB_OWNER:}
    repository: ${GITHUB_REPOSITORY:}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    connect-timeout-ms: ${GITHUB_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${GITHUB_READ_TIMEOUT_MS:15000}
  scoring:
    # Factor maxima (defaults sum to 100)
    build-max: 20
    tests-max: 20
    coverage-max: 15
    static-analysis-max: 15
    security-max: 25
    workflow-max: 5
    coverage-full-threshold: 80.0
    coverage-zero-threshold: 40.0
    missing-evidence-credit: 0.0
  policy:
    # Score bands: DEPLOY >= deploy-min-score, REVIEW >= review-min-score, else BLOCK
    deploy-min-score: 80
    review-min-score: 60
    block-on-critical-finding: true
    block-on-failed-build: true
    block-on-failed-tests: true
    block-on-failed-workflow: true
    review-on-high-finding: true

logging:
  level:
    root: INFO
    com.opsvision: INFO
