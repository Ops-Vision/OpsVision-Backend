name: Trivy (org template)
on: [push, pull_request]

jobs:
  trivy:
    # Update `myorg` and `org-actions` to your organization and template repo.
    # Use a released tag (recommended) like @v1 or use @main. Do NOT pass a secret named GITHUB_TOKEN.
    # Example: uses: myorg/org-actions/.github/workflows/trivy-scan-reusable.yml@v1
    uses: myorg/org-actions/.github/workflows/trivy-scan-reusable.yml@v1
    with:
      path: '.'
